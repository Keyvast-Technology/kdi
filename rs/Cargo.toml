# The KDI customer SDK in Rust. ITS OWN WORKSPACE, apart from the rv32imc firmware crates: they
# carry a `[patch.crates-io] zephyr` table, kv-logic's workspace-level `panic = "abort"` would
# apply here, and sw/zephyr/lib/CMakeLists.txt links a literal `target/riscv32imc-...` path.
[workspace]
resolver = "2"
members = ["kdi"]

[workspace.package]
# Tracks the KDI CONTRACT version, not the repo's release tag; asserted equal to the generated
# KDI_VERSION at COMPILE TIME, so a publish cannot disagree with the contract it claims.
version = "0.7.0"
edition = "2021"
# The toolchain these crates are ACTUALLY built and tested with (`rust-toolchain.toml` pins the
# same). It was 1.75, checked by nothing, and a `c"..."` literal (1.77) sat in `usb3.rs` unspotted.
# Lowering it again needs a CI job that builds at it; an unverified MSRV is worse than none.
rust-version = "1.97.1"
# An SPDX EXPRESSION, not one id: our code is Apache-2.0, the `vendor/` device drivers are
# proprietary third-party binaries (no SPDX id) that statically embed Lua 5.3.1 (MIT), attributed
# in NOTICE. Bare `Apache-2.0` claimed that licence over 8.2 MB of bytes we do not own.
license = "Apache-2.0 AND MIT AND LicenseRef-proprietary-device-driver"
# Both point at the umbrella repo, which holds the contract in `spec/` and this crate's source
# in `rs/`. `repository` was omitted while the only public repo was the contract: crates.io
# renders it as "Repository", and a link landing where the code is not is worse than no link.
repository = "https://github.com/Keyvast-Technology/kdi"
homepage = "https://github.com/Keyvast-Technology/kdi"
