[package]
name = "kdi"
description = "Keyvast Device Interface (KDI): find a device by identity, control it with typed commands, read its data streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
# Discovery metadata. `homepage` is the published contract, not a marketing page: it is what a
# consumer needs to check this crate against, and it is the same URL `repository` points at.
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/kdi"
keywords = ["instrument", "acquisition", "neuroscience", "sdk", "usb3"]
categories = ["science", "hardware-support", "api-bindings"]
# WITHOUT THIS THE PUBLISHED CRATE SHIPS NO DRIVER, silently: `vendor/*.bin` is gitignored, and
# with no `include` cargo enumerates via git and DROPS ignored files — unnoticed: `default = []`
# never reaches `include_bytes!`. `package --list` lies in a worktree; kdi.yml's step is proof.
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "vendor/*.bin",
    "LICENSE",
    "NOTICE",
    "README.md",
    "Cargo.toml",
]
# `tests/` IS DELIBERATELY NOT SHIPPED, for TWO reasons: `vendor_neutral.rs` exempts itself from
# its own scan, so a tarball would carry the manufacturer's name, board model and bench serial;
# and three suites read paths outside the crate root, so they would ship guaranteed to fail.
publish = ["crates-io"]

# Renders the feature gating: `Device::open_usb3`, `Error::Sdk` and `SdkErr` are marked with the
# feature that supplies them instead of vanishing from a default-feature build's docs. `bundled` is
# listed because docs.rs builds x86_64 Linux; still NOT `all-features`, which would creep.
[package.metadata.docs.rs]
features = ["usb3", "sim", "bundled"]
rustdoc-args = ["--cfg", "docsrs"]

# Calls `Device::open_usb3`, which only exists under the `usb3` feature. Without this entry a plain
# `cargo clippy --all-targets` builds the example featureless and fails on the missing method.
[[example]]
name = "health"
required-features = ["usb3"]

[[example]]
name = "rate_acceptance"
required-features = ["usb3"]

[[example]]
name = "emit_rate"
required-features = ["usb3"]

[[example]]
name = "usb3_handshake"
required-features = ["usb3"]

# Configures from caller-supplied bytes. Needs `usb3` (the FFI), not `bundled` (the driver
# blob). Bench builds add `bundled` so the Windows staging path actually `dlopen`s.
[[example]]
name = "usb3_configure"
required-features = ["usb3"]

[[example]]
name = "usb3_capture"
required-features = ["usb3"]

[dependencies]
# The message protocol IS JSON and the firmware emits \uXXXX escapes
# (sw/zephyr/app/console/src/kdi_ctl.c:57-63). Hand-parsing device bytes at a trust boundary is
# the flimsier algorithm, not the lazier one.
serde_json = "1"
# OPTIONAL AND OFF BY DEFAULT — the containment for the release-blocker risk in
# Nothing in a default build dlopen()s anything.
libloading = { version = "0.8", optional = true }

[features]
default = []
usb3 = ["dep:libloading"]
# Compile the target's USB3 driver into the artifact so a build runs where no driver is
# installed. Adds ~2 MB, OFF BY DEFAULT; vendored for Windows x86_64, Linux x86_64/aarch64 and
# macOS aarch64, anything else a compile error. The bytes are in the source EITHER WAY.
bundled = ["usb3"]
# tests/conform.rs only. It spawns `python3 -m kdi.cli serve`, so it must not run in a plain
# `cargo test` on a machine with no Python — and a MISSING python3 must fail that test rather
# than skip it, which is why the gate is a feature and not a runtime probe.
conform = []
# tests/gateware.rs only. The Verilator harness (`make kdi-sim`) is minutes of elaboration and a
# TCP port, so it must not run in a plain `cargo test` — and `src/simlink.rs` must not reach a
# default build's surface. Nothing here is a dependency: the harness is a socket.
sim = []
